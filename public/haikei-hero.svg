<svg width="1440" height="760" viewBox="0 0 1440 760" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin slice">
  <defs>
    <radialGradient id="hk-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hk-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hk-lavender" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hk-blob-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="hk-blob-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="hk-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="72" />
    </filter>
    <filter id="hk-soft-2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Soft gradient glow field -->
  <g filter="url(#hk-soft)">
    <ellipse cx="300" cy="170" rx="360" ry="300" fill="url(#hk-indigo)" opacity="0.55" />
    <ellipse cx="1180" cy="120" rx="320" ry="280" fill="url(#hk-violet)" opacity="0.5" />
    <ellipse cx="780" cy="20" rx="300" ry="240" fill="url(#hk-lavender)" opacity="0.75" />
    <ellipse cx="1020" cy="380" rx="280" ry="220" fill="url(#hk-indigo)" opacity="0.28" />
  </g>

  <!-- Layered organic blobs (Haikei blob scene) -->
  <g filter="url(#hk-soft-2)" opacity="0.5">
    <path transform="translate(160 60) scale(1.05)" fill="url(#hk-blob-1)" d="M421,300Q402,360,345,392Q288,424,225,406Q162,388,121,338Q80,288,99,224Q118,160,173,123Q228,86,295,96Q362,106,403,156Q444,206,421,300Z" />
  </g>
  <g filter="url(#hk-soft-2)" opacity="0.42">
    <path transform="translate(940 -30) scale(1.0)" fill="url(#hk-blob-2)" d="M392,286Q378,352,320,389Q262,426,201,401Q140,376,110,318Q80,260,107,200Q134,140,193,112Q252,84,316,103Q380,122,400,191Q420,260,392,286Z" />
  </g>
</svg>
